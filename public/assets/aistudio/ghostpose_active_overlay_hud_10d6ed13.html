<script>
  (function() {
    const slider = document.getElementById('opacity-slider');
    const badge = document.getElementById('opacity-badge');
    const poseContainer = document.getElementById('ghost-pose-container');
    const flipBtn = document.getElementById('flip-btn');
    const lockBtn = document.getElementById('lock-pose-btn');
    const toggleHudBtn = document.getElementById('toggle-hud-btn');
    const hudEyeIcon = document.getElementById('hud-eye-icon');
    const hudToggleText = document.getElementById('hud-toggle-text');
    const controlsPanel = document.getElementById('controls-panel');

    let isFlipped = true;
    let isLocked = false;
    let isHudHidden = false;

    // Continuous Opacity Drag Adjustment
    if (slider && badge && poseContainer) {
      slider.addEventListener('input', function(e) {
        const val = e.target.value;
        badge.innerText = val + '%';
        poseContainer.style.opacity = (val / 100).toString();
      });
    }

    // Mirroring horizontal toggle
    if (flipBtn && poseContainer) {
      flipBtn.addEventListener('click', function() {
        isFlipped = !isFlipped;
        poseContainer.style.transform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';
        if (isFlipped) {
          flipBtn.className = "flex flex-col items-center justify-center py-2 px-1 rounded bg-inverse-surface text-inverse-on-surface shadow-sm active:scale-95 transition-all";
          flipBtn.querySelector('span:first-child').className = "material-symbols-outlined text-[20px] text-tertiary-fixed";
          flipBtn.querySelector('span:last-child').innerText = "Flip H (Mirrored)";
        } else {
          flipBtn.className = "flex flex-col items-center justify-center py-2 px-1 rounded bg-surface-container-low text-on-surface active:scale-95 transition-all hover:bg-surface-container";
          flipBtn.querySelector('span:first-child').className = "material-symbols-outlined text-[20px] text-secondary";
          flipBtn.querySelector('span:last-child').innerText = "Flip H (Standard)";
        }
      });
    }

    // Lock mode passthrough feedback
    if (lockBtn) {
      lockBtn.addEventListener('click', function() {
        isLocked = !isLocked;
        const icon = lockBtn.querySelector('.material-symbols-outlined');
        const title = lockBtn.querySelector('.font-headline-sm');
        const sub = lockBtn.querySelector('.font-label-sm');

        if (isLocked) {
          lockBtn.classList.remove('bg-primary');
          lockBtn.classList.add('bg-on-tertiary-fixed-variant');
          icon.innerText = 'check_circle';
          icon.className = 'material-symbols-outlined text-[18px] text-tertiary-fixed';
          title.innerText = 'Passthrough Active';
          sub.innerText = 'Tap viewfinder anywhere to shoot';
        } else {
          lockBtn.classList.add('bg-primary');
          lockBtn.classList.remove('bg-on-tertiary-fixed-variant');
          icon.innerText = 'lock';
          icon.className = 'material-symbols-outlined text-[18px] text-tertiary-fixed';
          title.innerText = 'Lock Pose (Passthrough)';
          sub.innerText = 'Taps pass directly to shutter';
        }
      });
    }

    // Hide / Show HUD toggle
    if (toggleHudBtn && controlsPanel) {
      toggleHudBtn.addEventListener('click', function() {
        isHudHidden = !isHudHidden;
        const children = controlsPanel.children;
        // Keep header visible, minimize rest
        for (let i = 1; i < children.length; i++) {
          children[i].style.display = isHudHidden ? 'none' : '';
        }
        hudEyeIcon.innerText = isHudHidden ? 'visibility' : 'visibility_off';
        hudToggleText.innerText = isHudHidden ? 'Expand HUD' : 'Hide HUD';
      });
    }
  })();
</script></main></body></html>
